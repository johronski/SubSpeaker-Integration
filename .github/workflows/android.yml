name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Versionsnamn
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE=true" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && [ -z "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            # Ny version i version.txt: bygg och publicera release automatiskt.
            echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
            echo "RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=$VERSION-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Signeringsnyckel
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "Använder den fasta nyckeln i repot."
          fi

      - name: Enhetstester
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Bygg APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Byt namn på APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/SubSpeaker-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SubSpeaker-${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: Publicera release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: SubSpeaker ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          generate_release_notes: true
